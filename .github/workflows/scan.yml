name: Scan New Videos

on:
  schedule:
    - cron: '0 12 */3 * *'  # Every 3 days at UTC 12:00 (JST 21:00)
  workflow_dispatch:          # Allow manual trigger

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scan for new videos (last 7 days)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/scan_new.py --days 7

      - name: Build stats
        run: |
          python scripts/build_stats.py
          python scripts/build_known_songs.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: scan new videos $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push

      # 新曲が入ると tags/duration が空のまま残るので、単一の issue で追跡する。
      # 曲ごとに ticket を切ると通知が溢れるため、1 本を作成・更新・自動クローズする。
      - name: Report unfilled song_meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_song_meta.py --report /tmp/song_meta_todo.md
          TITLE='song_meta 未補完'
          NUM=$(gh issue list --state open --json number,title \
                 -q ".[] | select(.title==\"$TITLE\") | .number" | head -1)
          if [ -s /tmp/song_meta_todo.md ]; then
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --body-file /tmp/song_meta_todo.md
            else
              gh issue create --title "$TITLE" --body-file /tmp/song_meta_todo.md
            fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment '全曲補完済み 🎉'
          fi

      - name: Trigger deploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml
