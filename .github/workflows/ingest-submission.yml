name: Ingest Setlist Submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  ingest:
    # 只處理帶 setlist-submission label 的 Issue
    if: contains(github.event.issue.labels.*.name, 'setlist-submission')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Parse and ingest
        id: ingest
        # 失敗理由が Actions のログにしか残らず、投稿者からは「何も起きない」ように
        # 見えていた。出力を控えて、失敗時に issue へ貼る。
        run: |
          set -o pipefail
          python scripts/ingest_issue.py ${{ github.event.issue.number }} 2>&1 | tee /tmp/ingest.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALLOWED_USERS: ${{ vars.ALLOWED_USERS }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Explain failure on the issue
        if: failure() && steps.ingest.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '⚠️ 入庫に失敗しました。'
            echo
            echo '```'
            tail -n 20 /tmp/ingest.log 2>/dev/null || echo '(ログなし)'
            echo '```'
            echo
            echo '本文を直して `setlist-submission` label を付け直すと再実行されます。'
          } > /tmp/comment.md
          gh issue comment ${{ github.event.issue.number }} --body-file /tmp/comment.md

      - name: Rebuild stats
        run: python scripts/build_stats.py

      - name: Rebuild known songs
        run: python scripts/build_known_songs.py

      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "ingest: #${{ github.event.issue.number }}"
            git pull --rebase --autostash origin main
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Close issue (new data)
        if: steps.commit.outputs.changed == 'true'
        run: gh issue close ${{ github.event.issue.number }} --comment "✅ 已入庫，網站將自動更新。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 投稿が入るたびに新曲の tags/duration 抜けをチェックする
      - name: Report unfilled song_meta
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci/song_meta_issue.sh

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close issue (duplicate)
        if: steps.commit.outputs.changed == 'false'
        run: gh issue close ${{ github.event.issue.number }} --comment "ℹ️ 此影片已收錄，無新資料需要更新。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
